server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: microfinanzas-core

  # Configuración de Conexión a Microsoft SQL Server
  datasource:
    # La base de datos debe llamarse microfinanzas_db
    url: jdbc:sqlserver://localhost:1433;databaseName=microfinanzas_db;encrypt=true;trustServerCertificate=true;
    username: sa
    password: Admin123*
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # Configuración de JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      # Crea las tablas automáticamente basándose en tus entidades Java
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: dbo

# Configuración de Seguridad (JWT) para la autenticación del sistema
security:
  jwt:
    # Clave secreta para la generación de firmas digitales
    secret-key: MWYyZDFlMmU2ZjI4ZGIzZWY4MDQ0YmY5MjZkYmViNzkzYTJiNGZhMzRiNTc4MzRkY2U5MGRiNWJiZDY5ZWVjMA==
    expiration-time: 86400000 # Duración de 24 horas

# Módulo de Inteligencia Artificial para Detección de Riesgos
app:
  riesgo:
    # URL para el servicio de redes neuronales (Detección de anomalías)
    modelo-anomalias-url: http://localhost:8000/api/v1/evaluar-riesgo
    timeout-conexion: 5000